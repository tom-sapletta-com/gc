project_root: .
package_name: ''
include:
- '**/*.py'
exclude:
- '**/__pycache__/**'
- '**/node_modules/**'
- '**/.venv/**'
- '**/venv/**'
- '**/env/**'
- '**/.env/**'
- '**/site-packages/**'
- '**/.git/**'
- '**/build/**'
- '**/dist/**'
- '**/*.egg-info/**'
- 'tests/**'
- '**/tests/**'
- 'examples/**'
- '**/examples/**'
tools:
  parallel: true
  cache: false
  ruff:
    enabled: true
    max_line_length: 88
    select:
    - E
    - F
    - W
    - I
    ignore:
    - E501
  mypy:
    enabled: true
    strict: false
    ignore_missing_imports: true
  isort:
    enabled: true
    profile: black
    multi_line_output: 3
performance:
  max_workers: 4
  cache_size: 104857600
  chunk_size: 10
  autonomous_max_examples_per_issue: 3
  autonomous_max_issues: 500
  autonomous_max_files_to_scan: 1000
  autonomous_max_issues_per_file: 50
  autonomous_max_run_seconds: 300
  autonomous_max_tickets: 100
  autonomous_max_todo_items: 200
  autonomous_max_completed_todos: 100
  autonomous_max_todo_execution_items: 50
rules:
  # CLI output is part of the public interface, not leftover debug logging.
  ast-print-statements:
    enabled: false
  ruff-print-statements:
    enabled: false
  pylint-print-statements:
    enabled: false
  # These heuristic rules currently report named constants, package re-exports,
  # numeric/list addition, logging formats, and __main__ as code issues.
  ai-boilerplate:
    enabled: false
  ast-sorted-imports:
    enabled: false
  ast-string-concat:
    enabled: false
  context-aware-string-concat:
    enabled: false
  import-optimization:
    enabled: false
  magic-numbers:
    enabled: false
  string-concat-fstring:
    enabled: false
  pylint-string-concat:
    enabled: false
  string-formatting:
    enabled: false
  unused-imports:
    enabled: true
    tools:
    - ruff
    - autoflake
    severity: error
  relative-imports:
    enabled: true
    tools:
    - libcst
    auto_fix: true
  missing-return-type:
    enabled: true
    tools:
    - mypy
    severity: warning
  llm-hallucinations:
    enabled: true
plugins:
  enabled: true
  directories:
  - ~/.prefact/plugins
  - ./.prefact/plugins
environments:
  development:
    rules:
      print-statements:
        enabled: false
      magic-numbers:
        enabled: false
    performance:
      max_workers: 2
  production:
    rules:
      print-statements:
        enabled: false
      magic-numbers:
        enabled: false
    performance:
      max_workers: 8
