[build-system]
requires = ["setuptools>=61.0", "wheel", "twine"]
build-backend = "setuptools.build_meta"

[project]
name = "glon"
version = "0.1.28"
description = "Python package for garbage collection utilities and memory management"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Tom Sapletta", email = "tom@example.com"},
    {name = "Tom Sapletta", email = "tom@sapletta.com"},
]
maintainers = [
    {name = "Tom Sapletta", email = "tom@example.com"}
]
keywords = ["garbage-collection", "memory", "profiling", "utilities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Testing"
]
requires-python = ">=3.8"
dependencies = [
    "psutil>=5.8.0",
    "argcomplete>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "twine>=4.0.0",
    "build>=1.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "psutil>=5.8.0",
    "goal>=2.1.0; python_version >= '3.12'",
    "costs>=0.1.53; python_version >= '3.9'",
    "pfix>=0.1.60; python_version >= '3.10'",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "psutil>=5.8.0"
]

[project.scripts]
glon = "glon.cli:main"

[project.urls]
Homepage = "https://github.com/tom-sapletta/glon"
Repository = "https://github.com/tom-sapletta/glon.git"
Issues = "https://github.com/tom-sapletta/glon/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["glon*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ""

[tool.mypy]
# Modern mypy releases no longer accept 3.8 as an analysis target. The source
# remains Python 3.8 compatible; 3.9 is the oldest target supported by mypy.
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true
